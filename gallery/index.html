<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gallery — Photo Zhive</title>
<style>
:root{--bg:#f7f5f1;--card:#fff;--text:#171717;--muted:#6c6a66;--line:#e7e2da}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header,main,footer{max-width:1180px;margin:auto;padding-left:20px;padding-right:20px}
header{padding-top:34px;padding-bottom:18px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.brand{font-family:Georgia,serif;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
h1{margin:8px 0 0;font-family:Georgia,serif;font-size:clamp(34px,6vw,64px);font-weight:400;line-height:1}
.meta{color:var(--muted);font-size:14px}
main{padding-top:16px;padding-bottom:56px}
.status{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.75);color:var(--muted);margin-bottom:18px}
.status.error{color:#8b1e1e;background:#fff6f6;border-color:#ebcaca}
.codebox{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.codebox input{min-width:260px;flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit}
.codebox button{border:0;border-radius:999px;padding:12px 18px;background:#171717;color:white;font-weight:650;cursor:pointer}
.grid{column-count:3;column-gap:14px}
.item{break-inside:avoid;margin:0 0 14px;border-radius:14px;overflow:hidden;background:#eee;cursor:zoom-in}
.item img{display:block;width:100%;height:auto}
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.92);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
.overlay.open{display:flex}
.overlay img{max-width:94vw;max-height:86vh;object-fit:contain;border-radius:10px}
.close,.download{position:fixed;top:18px;border:0;border-radius:999px;background:#fff;color:#111;padding:11px 16px;font-weight:650;cursor:pointer;text-decoration:none}
.close{right:18px}.download{left:18px}
footer{padding-bottom:32px;color:var(--muted);font-size:13px}
@media(max-width:900px){.grid{column-count:2}}
@media(max-width:560px){.grid{column-count:1}}
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">Photo Zhive</div>
    <h1 id="title">Gallery</h1>
  </div>
  <div class="meta" id="count"></div>
</header>

<main>
  <div class="status" id="status">Відкриваю галерею…</div>

  <div class="codebox" id="codebox" hidden>
    <input id="codeInput" type="text" placeholder="Наприклад: test1">
    <button id="openBtn" type="button">Відкрити</button>
  </div>

  <section class="grid" id="grid"></section>
</main>

<footer>Приватна онлайн-галерея · Photo Zhive</footer>

<div class="overlay" id="overlay" aria-hidden="true">
  <a class="download" id="downloadBtn" href="#" target="_blank" rel="noopener">Завантажити оригінал</a>
  <button class="close" id="closeBtn" type="button">Закрити ✕</button>
  <img id="viewer" alt="">
</div>

<script>
const HIKBOX = {
  apiBase: 'https://217.24.165.253:20443/rest/1.1/share',
  accessToken: '65c4274a101f0043d621c8f39e4d438f:1788952047',
  shareId: '9UCYKO',
  rootPath: '/drives/disk_a1/Share/ext share'
};

const el = {
  title: document.getElementById('title'),
  count: document.getElementById('count'),
  status: document.getElementById('status'),
  grid: document.getElementById('grid'),
  codebox: document.getElementById('codebox'),
  codeInput: document.getElementById('codeInput'),
  openBtn: document.getElementById('openBtn'),
  overlay: document.getElementById('overlay'),
  viewer: document.getElementById('viewer'),
  downloadBtn: document.getElementById('downloadBtn'),
  closeBtn: document.getElementById('closeBtn')
};

function apiUrl(action, path, extra = {}) {
  const p = new URLSearchParams({
    access_token: HIKBOX.accessToken,
    action,
    path,
    share_id: HIKBOX.shareId,
    link_mode: '1',
    ...extra
  });
  return `${HIKBOX.apiBase}?${p.toString()}`;
}

function isImage(name = '') {
  return /\.(jpe?g|png|webp|gif|heic)$/i.test(name);
}

function getCode() {
  return new URLSearchParams(location.search).get('code')?.trim() || '';
}

function goToCode(code) {
  const clean = code.trim();
  if (!clean) return;
  location.href = `${location.pathname}?code=${encodeURIComponent(clean)}`;
}

async function loadGallery(code) {
  el.grid.innerHTML = '';
  el.count.textContent = '';
  el.codebox.hidden = true;
  el.status.hidden = false;
  el.status.className = 'status';
  el.status.textContent = 'Завантаження галереї…';

  try {
    // The URL code is the HikBox folder name.
    // Example: ?code=test1 -> /ext share/test1
    const folderPath = `${HIKBOX.rootPath}/${code}`;
    el.title.textContent = code;
    document.title = `${code} — Photo Zhive`;

    const listUrl = apiUrl('get_list', folderPath, {
      mode: '3',
      page: '1',
      pagesize: '500'
    });

    const r = await fetch(listUrl, { mode: 'cors', cache: 'no-store' });
    const data = await r.json();

    if (!r.ok || data.code) throw new Error(data.msg || `HTTP ${r.status}`);

    const files = (data.list || []).filter(x => !x.isdir && isImage(x.name));
    el.count.textContent = files.length ? `${files.length} фото` : '';
    el.status.hidden = true;

    if (!files.length) {
      el.status.hidden = false;
      el.status.textContent = 'У цій папці поки немає фотографій.';
      return;
    }

    for (const file of files) {
      const fullPath = `${folderPath}/${file.name}`;
      const card = document.createElement('article');
      card.className = 'item';

      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = file.name;
      img.src = apiUrl('get_thumbnail', fullPath, { quality: '1' });

      card.appendChild(img);
      card.addEventListener('click', () => openViewer(file.name, fullPath));
      el.grid.appendChild(card);
    }
  } catch (err) {
    console.error(err);
    el.status.hidden = false;
    el.status.className = 'status error';
    el.status.textContent = `Не вдалося завантажити галерею: ${err.message}`;
  }
}

function openViewer(name, path) {
  el.viewer.alt = name;
  el.viewer.src = apiUrl('get_thumbnail', path, { quality: '3' });
  el.downloadBtn.href = apiUrl('download', path);
  el.overlay.classList.add('open');
  el.overlay.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeViewer() {
  el.overlay.classList.remove('open');
  el.overlay.setAttribute('aria-hidden', 'true');
  el.viewer.src = '';
  document.body.style.overflow = '';
}

el.closeBtn.addEventListener('click', closeViewer);
el.overlay.addEventListener('click', e => { if (e.target === el.overlay) closeViewer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });
el.openBtn.addEventListener('click', () => goToCode(el.codeInput.value));
el.codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') goToCode(el.codeInput.value); });

const code = getCode();
if (code) {
  loadGallery(code);
} else {
  el.title.textContent = 'Gallery';
  el.status.textContent = 'Введіть код галереї.';
  el.codebox.hidden = false;
}
</script>
</body>
</html>
